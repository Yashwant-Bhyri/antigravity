services:
  api:
    build: ..
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - redis
    volumes:
      - ..:/app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Uncomment when ready for full production setup

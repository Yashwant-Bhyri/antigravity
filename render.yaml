services:
  - type: web
    name: antigravity-backend
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://antigravity-gz2r.vercel.app
      - key: NEXT_PUBLIC_API_URL
        value: https://antigravity-backend-2oaj.onrender.com
      - key: PROVENHIRE_API_URL
        value: https://provenhire-updated.onrender.com
      - key: ANTIGRAVITY_WEBHOOK_SECRET
        sync: false
